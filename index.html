<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Shirt Order Form</title>
</head>
<body>

<h1 style="text-align: center;">Order Your T-Shirt</h1>

<form action="/submit-order" method="POST" style="width: 60%; margin: 0 auto; padding: 20px;">
    <p style="font-weight: bold;">Customize Your T-Shirt</p>

    <p>
        <label for="design" style="display: inline-block; width: 150px;">Select Design:</label>
        <select id="design" name="design" required style="width: 200px;">
            <option value="">-- Please Select --</option>
            <option value="graphic">Graphic Design</option>
            <option value="solid">Solid Color</option>
            <option value="striped">Striped</option>
            <option value="logo">Logo T-Shirt</option>
        </select>
    </p>

    <p>
        <label for="size" style="display: inline-block; width: 150px;">Choose Size:</label>
        <select id="size" name="size" required style="width: 200px;">
            <option value="">-- Select Size --</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
            <option value="xl">XL</option>
            <option value="xxl">XXL</option>
        </select>
    </p>

    <p>
        <label for="color" style="display: inline-block; width: 150px;">Choose Color:</label>
        <select id="color" name="color" required style="width: 200px;">
            <option value="">-- Select Color --</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="green">Green</option>
        </select>
    </p>

    <p>
        <label for="quantity" style="display: inline-block; width: 150px;">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" max="100" required style="width: 50px;">
    </p>

    <p>
        <label for="special-requests" style="display: inline-block; width: 150px; vertical-align: top;">Special Requests:</label>
        <textarea id="special-requests" name="special-requests" rows="3" cols="40" placeholder="Any special requests..."></textarea>
    </p>

    <hr>

    <p style="font-weight: bold;">Provide Delivery Information</p>

    <p>
        <label for="recipient-name" style="display: inline-block; width: 150px;">Recipient Name:</label>
        <input type="text" id="recipient-name" name="recipient-name" placeholder="Full Name" required style="width: 250px;">
    </p>

    <p>
        <label for="address" style="display: inline-block; width: 150px; vertical-align: top;">Delivery Address:</label>
        <textarea id="address" name="address" rows="2" cols="40" placeholder="Complete Address" required></textarea>
    </p>

    <p>
        <label for="email" style="display: inline-block; width: 150px;">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" required style="width: 250px;">
    </p>

    <p>
        <label for="phone" style="display: inline-block; width: 150px;">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="1234567890" required pattern="[0-9]{10}" title="Enter a valid 10-digit phone number" style="width: 150px;">
    </p>

    <p>
        <label for="delivery-time" style="display: inline-block; width: 150px;">Delivery Time:</label>
        <input type="time" id="delivery-time" name="delivery-time" required style="width: 150px;">
    </p>

    <hr>

    <p style="text-align: center;">
        <button type="submit" style="padding: 10px 20px;">Submit Order</button>
        <button type="reset" style="padding: 10px 20px; margin-left: 20px;">Reset Form</button>
    </p>
</form>

</body>
</html>
